AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RecallOps judge demo - Lambda API and private S3 evidence receipts

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: CockroachDB Cloud connection string with sslmode=verify-full
  DemoTenantId:
    Type: String
    Default: demo-logistics
  BedrockModelId:
    Type: String
    Default: ""
  SourceCommit:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
    Description: Git commit used to build the deployed Lambda bundle
  SourceTree:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
    Description: Git tree used to build the deployed Lambda bundle

Conditions:
  HasBedrockModel: !Not [!Equals [!Ref BedrockModelId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 100
    Tracing: PassThrough
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        DEMO_TENANT_ID: !Ref DemoTenantId
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        DATABASE_POOL_MAX: "2"
        SOURCE_COMMIT: !Ref SourceCommit
        SOURCE_TREE: !Ref SourceTree

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-demo-receipts
            Status: Enabled
            ExpirationInDays: 45
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  RecallOpsApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../api/dist/
      Handler: handler.handler
      ReservedConcurrentExecutions: 2
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Sid: WriteDecisionReceiptsOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/decisions/${DemoTenantId}/*"
        - !If
          - HasBedrockModel
          - Statement:
              - Sid: InvokeBoundedReasoningModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
          - !Ref AWS::NoValue
      Tags:
        Project: RecallOps
        Purpose: HackathonJudgeDemo

  RecallOpsApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RecallOpsApi}"
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Description: Public judge demo API URL protected by tenant boundaries, database quotas, and concurrency caps
    Value: !GetAtt RecallOpsApiUrl.FunctionUrl
  EvidenceBucketName:
    Description: Private evidence receipt bucket
    Value: !Ref EvidenceBucket
  FunctionName:
    Value: !Ref RecallOpsApi
