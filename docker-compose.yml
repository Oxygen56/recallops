services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.0
    command: start-single-node --insecure --advertise-addr=cockroach
    ports:
      - "26257:26257"
      - "8088:8080"
    volumes:
      - recallops-crdb:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  recallops-crdb:
