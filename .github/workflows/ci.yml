name: RecallOps verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Start CockroachDB
        run: ./scripts/db_up.sh
      - name: Verify API and memory invariants
        working-directory: api
        run: |
          npm ci
          npm run migrate
          npm run build
          npm test
          npm run demo
          npm run evaluate
      - name: Verify judge interface
        working-directory: web
        env:
          VITE_API_BASE_URL: https://api.recallops.invalid/
        run: |
          npm ci
          npm run lint
          npm test
          ! grep -R -E 'localhost:8787|NEXT_PUBLIC_API_BASE_URL' dist/client dist/server
          grep -R -q 'https://api.recallops.invalid' dist/client
